
services:
  db:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - ./app/.env
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: .
    depends_on:
      - db
    env_file:
      - ./app/.env
    # environment will be inherited from env_file (app/.env)
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  db_data:
